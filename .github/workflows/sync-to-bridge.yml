name: Sync to Discord-Lolka-Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-discord-lolka-bridge
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone destination repository
        env:
          BRIDGE_SYNC_TOKEN: ${{ secrets.BRIDGE_SYNC_TOKEN }}
        run: |
          if [ -z "$BRIDGE_SYNC_TOKEN" ]; then
            echo "::error::Add BRIDGE_SYNC_TOKEN to the source repository secrets."
            exit 1
          fi

          DEST_DIR="$RUNNER_TEMP/discord-lolka-bridge"
          echo "DEST_DIR=$DEST_DIR" >> "$GITHUB_ENV"

          git clone --branch main --single-branch \
            "https://x-access-token:${BRIDGE_SYNC_TOKEN}@github.com/bwproject/Discord-Lolka-Bridge.git" \
            "$DEST_DIR"

      - name: Sync files (excluding environment secrets)
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --include='*/' \
            --include='.env.example' \
            --exclude='.env.*' \
            ./ "$DEST_DIR/"

      - name: Commit and push changes
        working-directory: ${{ runner.temp }}/discord-lolka-bridge
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Destination is already up to date."
            exit 0
          fi

          git add -A
          git commit -m "chore: sync from Discord-Lolka-Voice-Bridge"
          git push origin main
